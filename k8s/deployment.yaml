apiVersion: apps/v1
kind: Deployment
metadata:
  name: arithmetic-operations
  labels:
    app: arithmetic-operations
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arithmetic-operations
  template:
    metadata:
      labels:
        app: arithmetic-operations
    spec:
      containers:
        - name: arithmetic-operations
          image: node:22.23.2-bookworm-slim
          imagePullPolicy: IfNotPresent
          command: ["node"]
          args: ["/app/server.js"]
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: app-source
              mountPath: /app
              readOnly: true
      volumes:
        - name: app-source
          configMap:
            name: arithmetic-operations-source
